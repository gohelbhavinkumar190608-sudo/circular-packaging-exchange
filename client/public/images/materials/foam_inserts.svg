<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <radialGradient id="floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Foam Texture Pattern -->
    <pattern id="foam-texture" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1e293b"/>
      <circle cx="2" cy="2" r="0.9" fill="#334155" opacity="0.8"/>
      <circle cx="6" cy="6" r="1.1" fill="#334155" opacity="0.8"/>
      <circle cx="6" cy="2" r="0.7" fill="#0f172a" opacity="0.7"/>
      <circle cx="2" cy="6" r="0.8" fill="#0f172a" opacity="0.7"/>
    </pattern>

    <linearGradient id="foam-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="foam-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="foam-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cavity Inset Shadow -->
    <linearGradient id="cavity-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="foam-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Floor Shadow -->
  <ellipse cx="400" cy="510" rx="290" ry="38" fill="url(#floor-shadow)"/>

  <!-- Foam Cushioning Block -->
  <g filter="url(#foam-shadow)">
    <!-- Main Isometric Plank Base -->
    <g id="plank">
      <!-- Front Face (Height / Thickness) -->
      <polygon points="160,340 460,430 460,500 160,410" fill="url(#foam-front)" stroke="#334155" stroke-width="1.5"/>
      <!-- Right Side Face (Thickness) -->
      <polygon points="460,430 640,350 640,420 460,500" fill="url(#foam-side)" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Top Working Surface -->
      <polygon points="160,340 340,260 640,350 460,430" fill="url(#foam-top)" stroke="#475569" stroke-width="2"/>
      <polygon points="160,340 340,260 640,350 460,430" fill="url(#foam-texture)" opacity="0.3"/>

      <!-- Precision Die-Cut Cavity 1 (Large Rectangular Cutout for Equipment) -->
      <g id="cutout-1">
        <!-- Hole opening -->
        <polygon points="230,335 340,285 430,325 320,375" fill="#020617" stroke="#0f172a" stroke-width="2"/>
        <!-- Inner cavity left/back wall -->
        <polygon points="230,335 340,285 340,325 230,375" fill="url(#cavity-depth)"/>
        <!-- Cavity floor -->
        <polygon points="230,375 340,325 430,365 320,415" fill="#090d16"/>
      </g>

      <!-- Precision Die-Cut Cavity 2 (Circular Cylindrical Cutout for Gauges/Parts) -->
      <g id="cutout-2" transform="translate(480, 345)">
        <ellipse cx="0" cy="0" rx="42" ry="24" fill="#020617" stroke="#0f172a" stroke-width="2"/>
        <!-- Cylindrical Inner Wall -->
        <path d="M-42,0 C-42,13 0,24 42,24 L42,35 C0,35 -42,24 -42,11 Z" fill="url(#cavity-depth)"/>
        <!-- Bottom Floor -->
        <ellipse cx="0" cy="35" rx="38" ry="20" fill="#090d16"/>
      </g>

      <!-- Precision Die-Cut Cavity 3 (Slot Compartment) -->
      <g id="cutout-3">
        <polygon points="350,380 430,345 520,385 440,420" fill="#020617" stroke="#0f172a" stroke-width="2"/>
        <polygon points="350,380 430,345 430,375 350,410" fill="url(#cavity-depth)"/>
      </g>

      <!-- Clean Beveled Edges Highlights -->
      <line x1="160" y1="340" x2="460" y2="430" stroke="#64748b" stroke-width="2" opacity="0.6"/>
      <line x1="460" y1="430" x2="640" y2="350" stroke="#475569" stroke-width="1.5" opacity="0.5"/>

      <!-- Specification Plate -->
      <g transform="translate(180, 420) rotate(17)">
        <rect x="0" y="0" width="110" height="24" rx="4" fill="#0284c7" opacity="0.9"/>
        <text x="55" y="16" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">EVA / EPE FOAM • 45kg/m³</text>
      </g>
    </g>
  </g>
</svg>
