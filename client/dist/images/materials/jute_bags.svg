<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif">
  <defs>
    <!-- Background Gradient matching studio photography -->
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </radialGradient>

    <!-- Soft Ambient Floor Shadow -->
    <radialGradient id="floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>

    <!-- Woven Jute Texture Pattern -->
    <pattern id="jute-weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c49e6d"/>
      <path d="M0 3.5h14M0 10.5h14M3.5 0v14M10.5 0v14" stroke="#b08652" stroke-width="1.8" opacity="0.6"/>
      <path d="M0 7h14M7 0v14" stroke="#ddb785" stroke-width="1.2" opacity="0.4"/>
      <circle cx="3.5" cy="3.5" r="1" fill="#8f6738" opacity="0.4"/>
      <circle cx="10.5" cy="10.5" r="1" fill="#8f6738" opacity="0.4"/>
    </pattern>

    <linearGradient id="sack-shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="vertical-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Floor Contact Shadow -->
  <ellipse cx="400" cy="515" rx="270" ry="38" fill="url(#floor-shadow)"/>

  <!-- Main Sacks Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Rear Stacked Sack (Subtle Angle) -->
    <g transform="translate(140, 30) rotate(-7 300 300)">
      <path d="M210 210 C190 270 180 370 190 440 C200 485 370 485 385 440 C400 370 390 270 370 210 Z" fill="url(#jute-weave)" stroke="#87602f" stroke-width="2"/>
      <path d="M210 210 C190 270 180 370 190 440 C200 485 370 485 385 440 C400 370 390 270 370 210 Z" fill="url(#sack-shade)"/>
      <path d="M250 150 C230 170 230 200 260 210 C290 215 310 215 335 210 C365 200 365 170 345 150 Z" fill="url(#jute-weave)" stroke="#87602f" stroke-width="2"/>
      <rect x="270" y="200" width="55" height="12" rx="4" fill="#edd5ae" stroke="#87602f" stroke-width="2"/>
    </g>

    <!-- Front Standing Sack -->
    <g id="front-sack">
      <!-- Main Sack Silhouette -->
      <path d="M250 205 
               C215 250 195 335 205 415 
               C215 475 255 510 320 512 
               C370 514 430 514 480 512 
               C545 510 585 475 595 415 
               C605 335 585 250 550 205 
               C505 190 295 190 250 205 Z" 
            fill="url(#jute-weave)" stroke="#785526" stroke-width="2.5"/>
      
      <!-- Lighting Overlays -->
      <path d="M250 205 C215 250 195 335 205 415 C215 475 255 510 320 512 C370 514 430 514 480 512 C545 510 585 475 595 415 C605 335 585 250 550 205 C505 190 295 190 250 205 Z" fill="url(#sack-shade)"/>
      <path d="M250 205 C215 250 195 335 205 415 C215 475 255 510 320 512 C370 514 430 514 480 512 C545 510 585 475 595 415 C605 335 585 250 550 205 C505 190 295 190 250 205 Z" fill="url(#vertical-shade)"/>

      <!-- Creases & Seams -->
      <path d="M225 345 Q310 375 400 365 Q500 355 575 335" fill="none" stroke="#634114" stroke-width="3" opacity="0.35"/>
      <path d="M215 425 Q315 450 410 445 Q515 440 585 415" fill="none" stroke="#634114" stroke-width="3.5" opacity="0.35"/>
      <path d="M240 275 Q310 295 400 290 Q490 285 560 270" fill="none" stroke="#634114" stroke-width="2.5" opacity="0.3"/>

      <!-- Bunched Neck -->
      <path d="M335 140 C300 160 305 190 340 200 C370 205 430 205 460 200 C495 190 500 160 465 140 C430 130 370 130 335 140 Z" fill="url(#jute-weave)" stroke="#785526" stroke-width="2"/>
      <path d="M335 140 C300 160 305 190 340 200 C370 205 430 205 460 200 C495 190 500 160 465 140 C430 130 370 130 335 140 Z" fill="url(#vertical-shade)"/>

      <!-- Natural Frayed Jute Crown Top -->
      <path d="M345 140 L340 120 L355 133 L370 115 L382 130 L400 112 L418 131 L432 115 L448 133 L458 120 L455 140 Z" fill="#b88f5a" stroke="#785526" stroke-width="1.5"/>

      <!-- Thick Tied Twine Rope -->
      <ellipse cx="400" cy="198" rx="58" ry="12" fill="#edd6b1" stroke="#856230" stroke-width="2.5"/>
      <path d="M350 196 C370 204 430 204 450 196" fill="none" stroke="#68461b" stroke-width="2"/>
      <path d="M425 202 Q435 238 440 258" stroke="#edd6b1" stroke-width="5" stroke-linecap="round"/>
      <path d="M425 202 Q435 238 440 258" stroke="#856230" stroke-width="1" stroke-linecap="round" fill="none"/>
      <path d="M415 202 Q418 232 414 248" stroke="#edd6b1" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Stencil Packaging Stamp -->
      <g transform="translate(290, 305) rotate(-2)" opacity="0.85">
        <!-- Eco circular seal -->
        <circle cx="110" cy="50" r="42" fill="none" stroke="#166534" stroke-width="2.5" stroke-dasharray="7 3"/>
        <text x="110" y="44" font-size="12" font-weight="900" fill="#166534" text-anchor="middle" letter-spacing="1">100% NATURAL</text>
        <text x="110" y="60" font-size="13" font-weight="900" fill="#166534" text-anchor="middle" letter-spacing="1.5">JUTE FIBER</text>
        
        <!-- B2B Spec -->
        <text x="110" y="112" font-size="18" font-weight="900" fill="#2d241e" text-anchor="middle" letter-spacing="1.5">HEAVY-DUTY BURLAP</text>
        <text x="110" y="132" font-size="12" font-weight="800" fill="#42352b" text-anchor="middle" letter-spacing="1">TARE: 50 KG • REUSABLE</text>
      </g>
    </g>
  </g>
</svg>
